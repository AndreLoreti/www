<!doctype html>
<html lang="en">
  <head>
    <title>My Portfolio</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <!-- Google Fonts CSS -->
    <link
      href="https://fonts.googleapis.com/css?family=Kalam&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap"
      rel="stylesheet"
    />

    <!-- Main CSS -->
    <link rel="stylesheet" href="css/main.css" />
  </head>

  <body>
    <header id="top" class="container-fluid pt-3 px-4">
      <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
          <a class="navbar-brand" href="#top">André Loreti</a> <!-- Nome no canto esq -->
           <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNavAltMarkup"
            aria-controls="navbarNavAltMarkup"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
            <div class="navbar navbar-expand">
                <div class="navbar-nav">
                    <!-- Clicar aqui vai para o id="top" -->
                    <a class="nav-link active" aria-current="page" href="#top">Home</a>
                    <a class="nav-link" href="#skills">Skills</a>
                    <a class="nav-link" href="#about">About me</a>
                    <a class="nav-link" href="#contact">Contact me</a>
                </div>
            </div>
        </div>
      </nav>
      </div>
    </header>

    <main>
      <section>
        <h1 class="text-xl-center">PORTFOLIO</h1>
        <h2 class="text-lg-center">Software Engineering</h2>
      </section>

      <section id="skills">
        <h2 class="text-lg-center">MY SKILLS</h2>
        <!-- conteudo  -->
      </section>

      <section id="about">
        <h2 class="text-lg-center">ABOUT ME</h2>
        <!-- conteudo  -->
      </section>

      <section id="contact">
        <h2 class="text-lg-center">CONTACT ME</h2>
        <!-- conteudo  -->
      </section>
    </main>

    <!-- Optional JavaScript -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const navbarToggler = document.querySelector(".navbar-toggler");

        if (navbarToggler) {
          navbarToggler.addEventListener("click", function () {
            navbarToggler.classList.toggle("change");
          });
        }
      });
    </script>
  </body>
</html>
